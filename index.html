        <a href="https://wa.me/6285122900879?text=Halo%20Admin%20Sobari,%20saya%20butuh%20bantuan%20darurat%20di%20Charging%20Station." 
           target="_blank"

    <!-- Chat Container -->
    <main id="chatContainer" class="flex-1 wa-chat-bg p-4 flex flex-col justify-end max-w-md w-full mx-auto space-y-3 overflow-y-auto pb-28">
        <div class="flex items-end space-x-2 fade-in">
            <div class="w-7 h-7 rounded-full bg-emerald-700 flex items-center justify-center overflow-hidden mb-1 shadow text-white font-bold text-xs">
                <img src="sobari.jpeg" alt="Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentNode.innerHTML='⚡';">
            </div>
            <div class="bg-[#202c33] text-slate-100 p-3.5 rounded-2xl rounded-bl-sm max-w-[88%] text-xs shadow space-y-2 border border-slate-700/50">
                <p class="font-bold text-emerald-400 text-sm">Halo, Warga Riverside! 👋</p>
                <p id="botGreetingText">Memeriksa status station...</p>
                <div class="bg-black/20 p-2 rounded-lg border border-slate-700/30 text-[11px] text-slate-300">
                    💡 <i>Pastikan foto meteran jelas.</i>

                <span class="text-[10px] text-slate-400 block text-right" id="currentTime">21:23</span>

        </div>
    </main>

    <!-- Floating Dashboard Toggle Button -->
    <div class="fixed bottom-20 right-4 z-40 flex flex-col items-center">
        <button onclick="openDashboardModal()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 p-3.5 rounded-full shadow-2xl flex items-center justify-center border-2 border-[#005c4b] transition-transform active:scale-95 group" title="Cek Rekap Pemakaian Unit">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 group-hover:rotate-12 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
        </button>
        <span class="bg-[#111b21]/90 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-md mt-1 pointer-events-none">Cek Rekap</span>
    </div>

    <!-- Modal Dashboard Rekap Unit -->
    <div id="dashboardModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#1f2c34] border border-slate-700 w-full max-w-lg rounded-2xl p-5 text-slate-100 shadow-2xl space-y-3 max-h-[90vh] flex flex-col">
            
            <!-- Header Modal -->
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                <div class="flex items-center space-x-2">
                    <span class="text-xl">📊</span>
                    <h3 class="font-bold text-sm text-emerald-400">Dashboard Rekap Pemakaian Unit</h3>
                </div>
                <button onclick="closeDashboardModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">&times;</button>
            </div>

            <!-- Filter Area -->
            <div class="space-y-2 bg-[#111b21] p-3 rounded-xl border border-slate-700/80 text-xs">
                <div class="flex space-x-2">
                    <input type="text" id="inputSearchUnit" placeholder="No Unit / Token (Contoh: 2A)" 
                        class="flex-1 bg-[#202c33] text-slate-100 px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500 uppercase">
                    <button onclick="fetchUnitHistory()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg transition-all shadow-md">
                        Cari Data
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1"> Dari Tanggal:</label>
                        <input type="date" id="filterStartDate" onchange="filterDataRekap()" class="w-full bg-[#202c33] text-slate-200 px-2.5 py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1"> Sampai Tanggal:</label>
                        <input type="date" id="filterEndDate" onchange="filterDataRekap()" class="w-full bg-[#202c33] text-slate-200 px-2.5 py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <button onclick="resetFilterTanggal()" class="text-[10px] text-emerald-400 hover:underline">🔄 Reset Rentang Tanggal</button>
                </div>
            </div>

            <!-- Container Hasil Rekap -->
            <div id="dashboardResult" class="flex-1 overflow-y-auto space-y-2.5 text-xs pr-1">
                <p class="text-slate-400 text-center py-8">Ketik nomor unit atau token, lalu klik 'Cari Data' untuk melihat rekap.</p>
            </div>
            
        </div>
    </div>

    <!-- Modal Zoom Preview Foto Base64 -->
    <div id="modalZoomFoto" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 hidden p-4" onclick="tutupZoomFoto()">
        <div class="relative max-w-sm w-full text-center" onclick="event.stopPropagation()">
            <img id="imgZoomPreview" src="" alt="Bukti Foto Meteran" class="rounded-xl max-h-[75vh] mx-auto border border-slate-700 shadow-2xl">
            <button onclick="tutupZoomFoto()" class="mt-4 bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2 rounded-lg border border-slate-600 font-semibold shadow">Tutup Gambar</button>
        </div>
    </div>

    <!-- Footer Input Bar -->
    <footer class="bg-[#202c33] py-2.5 px-3 border-t border-slate-800 fixed bottom-0 left-0 right-0 z-50 max-w-md mx-auto">
        <form id="chatForm" onsubmit="handleMainSubmit(event)" class="flex flex-col space-y-2">
            
<!-- Opsi Tambahan Pilihan Durasi (Diperbarui dengan 5, 7, dan 9 Jam) -->
<div id="durationWrapper" class="hidden flex items-center justify-between bg-[#111b21] px-3 py-1.5 rounded-lg border border-slate-700/50 text-xs">
    <span class="text-slate-300 font-medium">⏱️ Estimasi Charging:</span>
    <select id="selectDuration" class="bg-[#202c33] text-emerald-400 font-bold px-2 py-1 rounded border border-slate-600 focus:outline-none">
        <option value="30">30 Menit (Kilat)</option>
        <option value="60" selected>1 Jam (Standar)</option>
        <option value="120">2 Jam (Penuh)</option>
        <option value="180">3 Jam (Long)</option>
        <option value="300">5 Jam (Panjang)</option>
        <option value="420">7 Jam (Malam)</option>
        <option value="540">9 Jam (Full Sehari)</option>
    </select>
</div>
            <div class="flex items-center space-x-2">
                <label class="p-2.5 rounded-full bg-[#111b21] hover:bg-slate-800 text-emerald-400 cursor-pointer border border-slate-700/50 flex items-center justify-center transition-all shadow-inner">
                    <input type="file" id="fotoInput" accept="image/*" onchange="handleFileSelected(this)" class="hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </label>

                <div class="relative flex-1">
                    <input type="text" id="mainInput" required placeholder="Ketik pesan..." 
                        class="w-full bg-[#111b21] text-slate-100 placeholder-slate-500 text-xs rounded-full px-4 py-3 focus:outline-none border border-slate-700/50 pr-16">
                    <span id="fileBadge" class="hidden absolute right-3 top-2.5 text-[10px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded-full font-bold">Foto OK</span>
                </div>

                <button type="submit" id="btnSend" class="w-11 h-11 rounded-full bg-[#00a884] hover:bg-[#008f72] text-slate-950 flex items-center justify-center shadow-md transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-950 translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                    </svg>
                </button>
            </div>
        </form>
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZViP_65l9YXMcEIAFB5V1i242YbReg5ZtT_9e6jpnC7h0I9JkCGoZq2YGyJW1FQvA/exec"; 
        
        const urlParams = new URLSearchParams(window.location.search);
        const STATION_ID = (urlParams.get('station') || 'T1').toUpperCase();

        let appState = 'LOADING'; 
        let activeSessionData = { angkaAwal: 0, token: '' };
        let selectedFileBase64 = null;
        let selectedFileMeta = { name: '', type: '' };
        let countdownInterval = null;
        let cacheRiwayatData = [];

        document.getElementById('currentTime').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('badgeStation').innerText = `Station ${STATION_ID}`;
            
            try {
                const response = await fetch(`${SCRIPT_URL}?stationId=${STATION_ID}`);
                const result = await response.json();

                if (result.status === "ACTIVE_SESSION") {
                    appState = 'CHECKOUT';
                    activeSessionData.angkaAwal = result.angkaAwal;
                    activeSessionData.token = result.token || "Penghuni";
                    
                    document.getElementById('botGreetingText').innerHTML = `⚡ <b>Station ${STATION_ID} Sedang Digunakan</b><br>Unit: <b>${activeSessionData.token}</b><br>Stand Awal: <b>${result.angkaAwal} kWh</b><br><br>Silakan masukkan <b>Angka kWh Akhir</b> dari foto meteran, lalu klik kirim.`;
                    document.getElementById('mainInput').placeholder = "Masukkan Angka kWh Akhir...";
                    document.getElementById('mainInput').type = "number";
                    document.getElementById('mainInput').step = "0.1";
                } else {
                    appState = 'CHECKIN';
                    activeSessionData.angkaAwal = result.lastAngka || 0;
                    
                    const durationWrapper = document.getElementById('durationWrapper');
                    if (durationWrapper) durationWrapper.classList.remove('hidden');
                    
                    document.getElementById('botGreetingText').innerHTML = `Station <b>${STATION_ID}</b> siap digunakan.<br>Stand Awal Terdeteksi: <b>${activeSessionData.angkaAwal} kWh</b><br><br>Silakan pilih estimasi durasi, ketik <b>Nomor Unit / Token</b>, dan lampirkan foto kWh awal.`;
                    document.getElementById('mainInput').placeholder = "Ketik Nomor Unit / Token...";
                }
            } catch (error) {
                appendBotBubble("⚠️ Gagal terhubung ke server bot. Periksa koneksi.");
            }
        });

        function handleFileSelected(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                selectedFileMeta.name = file.name;
                selectedFileMeta.type = file.type;

                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedFileBase64 = e.target.result.split(',')[1];
                    document.getElementById('fileBadge').classList.remove('hidden');
                    appendBotBubble(`📎 Foto <b>"${file.name}"</b> berhasil dilampirkan. Silakan lengkapi teks dan kirim.`);
                };
                reader.readAsDataURL(file);
            }
        }

        async function handleMainSubmit(event) {
            event.preventDefault();
            const inputValue = document.getElementById('mainInput').value.trim();
            const btnSend = document.getElementById('btnSend');

            if (!selectedFileBase64) {
                appendBotBubble("⚠️ Wajib melampirkan foto kWh melalui tombol (+) di samping!");
                return;
            }

            if (!inputValue) {
                appendBotBubble("⚠️ Kolom teks tidak boleh kosong!");
                return;
            }

            btnSend.disabled = true;
            document.getElementById('mainInput').disabled = true;
            appendBotBubble("⏳ Mengirim laporan dan memproses data ke server...");

            let payload = {};
            let selectedDurationMinutes = 60;

            if (appState === 'CHECKIN') {
                const selectEl = document.getElementById('selectDuration');
                selectedDurationMinutes = selectEl ? parseInt(selectEl.value) || 60 : 60;
                
                payload = {
                    action: "checkin",
                    stationId: STATION_ID,
                    token: inputValue,
                    angkaAwal: activeSessionData.angkaAwal,
                    durasiMenit: selectedDurationMinutes,
                    fotoName: selectedFileMeta.name,
                    fotoMime: selectedFileMeta.type,
                    fotoBase64: selectedFileBase64
                };
            } else {
                const angkaAkhir = parseFloat(inputValue);
                if (angkaAkhir < activeSessionData.angkaAwal) {
                    appendBotBubble(`❌ Angka akhir (${angkaAkhir}) tidak boleh lebih kecil dari stand awal (${activeSessionData.angkaAwal})!`);
                    btnSend.disabled = false;
                    document.getElementById('mainInput').disabled = false;
                    return;
                }
                payload = {
                    action: "finish",
                    stationId: STATION_ID,
                    angkaAkhir: angkaAkhir,
                    fotoName: selectedFileMeta.name,
                    fotoMime: selectedFileMeta.type,
                    fotoBase64: selectedFileBase64
                };
            }

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "SUCCESS") {
                    if (appState === 'CHECKIN') {
                        appendBotBubble(`✅ <b>CHECK-IN BERHASIL!</b><br>Station: ${STATION_ID}<br>Unit: ${inputValue}<br>Durasi Pilihan: <b>${selectedDurationMinutes} Menit</b><br>Stand Awal: ${activeSessionData.angkaAwal} kWh<br><br><span id="reminderStatus" class="text-emerald-400 font-bold">⏱️ Menghitung waktu sesi...</span>`);
                        startFrontendReminder(new Date().getTime(), selectedDurationMinutes);
                    } else {
                        const totalKwh = result.totalKwh || 0;
                        const estTarif = Math.round(totalKwh * 2500); 
                        
                        appendBotBubble(`🏁 <b>LAPORAN PENGECASAN SELESAI</b><br><br>` +
                            `📍 Lokasi: <b>${STATION_ID}</b><br>` +
                            `🆔 Unit/Token: <b>${activeSessionData.token}</b><br>` +
                            `🔢 Stand Awal: <b>${result.angkaAwal} kWh</b><br>` +
                            `🔢 Stand Akhir: <b>${result.angkaAkhir} kWh</b><br>` +
                            `📊 <b>Total Pemakaian: ${totalKwh.toFixed(2)} kWh</b><br>` +
                            `💰 <b>Estimasi Biaya: Rp ${estTarif.toLocaleString('id-ID')}</b><br><br>` +
                            `<i>Data berhasil direkap ke sistem.</i><br>` +
                            `<button onclick="location.reload()" class="mt-2 bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition-all">Selesai / Refresh Sekarang</button>`);
                    }
                } else {
                    appendBotBubble(`❌ Gagal: ${result.message}`);
                    btnSend.disabled = false;
                    document.getElementById('mainInput').disabled = false;
                }
            } catch (e) {
                appendBotBubble("❌ Terjadi kesalahan jaringan ke server.");
                btnSend.disabled = false;
                document.getElementById('mainInput').disabled = false;
            }
        }

        function startFrontendReminder(startTimeMs, durationMinutes) {
            const targetTime = startTimeMs + (durationMinutes * 60 * 1000);
            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const timeLeft = targetTime - now;

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    triggerOvertimeAlert();
                } else {
                    const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                    const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    
                    const reminderEl = document.getElementById('reminderStatus');
                    if (reminderEl) {
                        reminderEl.innerText = `⏱️ Sisa Waktu Sesi: ${hours > 0 ? hours + 'j ' : ''}${minutes}m ${seconds}s`;
                    }
                }
            }, 1000);
        }

        function triggerOvertimeAlert() {
            appendBotBubble(`🚨 <b>PERINGATAN WAKTU HABIS!</b><br>Estimasi durasi pengecasan yang Anda pilih telah selesai. Harap segera turun untuk mencabut kendaraan dan melakukan <i>Checkout</i>!`);
            if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
        }

        function openDashboardModal() {
            document.getElementById('dashboardModal').classList.remove('hidden');
            const footerChat = document.querySelector('footer');
            if (footerChat) footerChat.classList.add('hidden');
        }
        function closeDashboardModal() {
            document.getElementById('dashboardModal').classList.add('hidden');
            const footerChat = document.querySelector('footer');
            if (footerChat) footerChat.classList.remove('hidden');
        }
        function bukaZoomFoto(urlFoto) {
            document.getElementById("imgZoomPreview").src = urlFoto;
            document.getElementById("modalZoomFoto").classList.remove('hidden');
        }
        function tutupZoomFoto() {
            document.getElementById("modalZoomFoto").classList.add('hidden');
        }
        function resetFilterTanggal() {
            document.getElementById("filterStartDate").value = "";
            document.getElementById("filterEndDate").value = "";
            filterDataRekap();
        }

        function fetchUnitHistory() {
            var unitQuery = document.getElementById("inputSearchUnit").value.trim();
            var resultContainer = document.getElementById("dashboardResult");
            
            if (!unitQuery) {
                resultContainer.innerHTML = `<p class="text-amber-400 text-center py-4">Masukkan nomor unit atau token terlebih dahulu!</p>`;
                return;
            }

            resultContainer.innerHTML = `<p class="text-slate-400 text-center py-4">Memuat data rekap...</p>`;

            fetch(`${SCRIPT_URL}?action=getHistory&unitQuery=${encodeURIComponent(unitQuery)}`)
                .then(response => response.json())
                .then(res => {
                    if (res.status === "SUCCESS_HISTORY" && res.data.length > 0) {
                        // REVERSE DATA: Urutkan dari yang terbaru (New to Old)
                        cacheRiwayatData = res.data.reverse();
                        filterDataRekap();
                    } else {
                        cacheRiwayatData = [];
                        resultContainer.innerHTML = `<p class="text-slate-400 text-center py-6">Tidak ada riwayat ditemukan untuk unit tersebut.</p>`;
                    }
                })
                .catch(err => {
                    resultContainer.innerHTML = `<p class="text-red-400 text-center py-6">Gagal memuat data rekap.</p>`;
                });
        }

        function filterDataRekap() {
            var resultContainer = document.getElementById("dashboardResult");
            var startDateVal = document.getElementById("filterStartDate").value;
            var endDateVal = document.getElementById("filterEndDate").value;
            
            if (cacheRiwayatData.length === 0) return;

            let filteredData = cacheRiwayatData.filter(item => {
                if (!item.timestamp || item.timestamp === "-") return true;
                
                let parts = item.timestamp.split(" ")[0].split("/");
                let itemDateStr = `${parts[2]}-${parts[1]}-${parts[0]}`; 
                let itemDate = new Date(itemDateStr);

                if (startDateVal && itemDate < new Date(startDateVal)) return false;
                if (endDateVal && itemDate > new Date(endDateVal)) return false;

                return true;
            });

            if (filteredData.length === 0) {
                resultContainer.innerHTML = `<p class="text-slate-400 text-center py-6">Tidak ada riwayat pada rentang tanggal tersebut.</p>`;
                return;
            }

            let totalKwhSemua = 0;
            let totalBiayaSemua = 0;
            const tarifPerKwh = 2500;

            filteredData.forEach(item => {
                let kwh = parseFloat(item.totalKwh) || 0;
                totalKwhSemua += kwh;
                totalBiayaSemua += (kwh * tarifPerKwh);
            });

            let htmlContent = `
                <div class="bg-gradient-to-r from-emerald-950 to-teal-950 border border-emerald-600/40 rounded-xl p-3 mb-2 shadow-md">
                    <div class="text-[11px] font-bold text-emerald-400 mb-1 flex items-center justify-between">
                        <span>📈 RINGKASAN PEMAKAIAN</span>
                        <span class="text-slate-300 font-normal">${filteredData.length} Transaksi</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-slate-200 pt-1 border-t border-emerald-800/40">
                        <div><span class="text-[10px] text-slate-400 block">Total Keseluruhan kWh:</span> <b class="text-emerald-300 text-sm">${totalKwhSemua.toFixed(2)} kWh</b></div>
                        <div><span class="text-[10px] text-slate-400 block">Total Tagihan Biaya:</span> <b class="text-amber-400 text-sm">Rp ${totalBiayaSemua.toLocaleString('id-ID')}</b></div>
                    </div>
                </div>
            `;

            filteredData.forEach(item => {
                let totalKwh = parseFloat(item.totalKwh) || 0;
                let totalBiaya = totalKwh * tarifPerKwh;
                
                // Pastikan pemanggilan foto Base64 aman dan lolos render
let fotoBtn = (item.fotoUrl && item.fotoUrl.length > 10) ? `
                    <button onclick="bukaZoomFoto('${item.fotoUrl}')" class="bg-slate-700 hover:bg-slate-600 text-emerald-400 border border-emerald-500/30 text-[10px] px-2.5 py-1 rounded-md transition-all flex items-center gap-1 font-semibold">
                        📷 Lihat Foto
                    </button>` : `<span class="text-[10px] text-slate-500">Tanpa Foto</span>`;
                
                htmlContent += `
                    <div class="bg-[#111b21] border border-slate-700/80 rounded-xl p-3 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800/50">📍 ${item.station}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded font-semibold ${item.status === 'Closed' ? 'bg-slate-800 text-slate-300 border border-slate-700' : 'bg-amber-950 text-amber-400'}">${item.status}</span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-1 text-slate-300 pt-1">
                            <div><span class="text-slate-500">Waktu:</span> ${item.timestamp}</div>
                            <div><span class="text-slate-500">Total:</span> <b class="text-emerald-400">${totalKwh.toFixed(2)} kWh</b></div>
                            <div><span class="text-slate-500">Stand:</span> ${item.awal} ➔ ${item.akhir || 'Proses'}</div>
                            <div><span class="text-slate-500">Biaya:</span> <b class="text-amber-400">Rp ${totalBiaya.toLocaleString('id-ID')}</b></div>
                        </div>

                        <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                            <span class="text-slate-500 text-[10px]">Bukti Meteran:</span>
                            ${fotoBtn}
                        </div>
                    </div>
                `;
            });

            resultContainer.innerHTML = htmlContent;
        }

function appendBotBubble(htmlText) {
            const container = document.getElementById('chatContainer');
            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const bubbleHTML = `
                <div class="flex items-end space-x-2 fade-in">
                    <div class="w-7 h-7 rounded-full bg-emerald-700 flex items-center justify-center overflow-hidden mb-1 shadow text-white font-bold text-xs">
                        <img src="sobari.jpeg" alt="Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentNode.innerHTML='🏢';">
                    </div>
                    <div class="bg-[#202c33] text-slate-100 p-3.5 rounded-2xl rounded-bl-sm max-w-[88%] text-xs shadow space-y-1.5 border border-slate-700/50">
                        <p>${htmlText}</p>
                        <span class="text-[10px] text-slate-400 block text-right">${timeNow}</span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', bubbleHTML);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
