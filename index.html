<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charger Checkpoint - Muara Indah Riverside</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500 text-slate-900 p-2 rounded-xl font-bold text-lg">⚡</div>
                <div>
                    <h1 class="font-bold text-base tracking-wide text-white">EV Charger Station</h1>
                    <p class="text-xs text-slate-400">Muara Indah Riverside</p>
                </div>
            </div>
            <span class="text-xs px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full font-medium">Online</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto p-4 my-auto">
        
        <!-- Card Box -->
        <div class="bg-slate-800/80 backdrop-blur-md border border-slate-700/80 rounded-2xl p-6 shadow-xl">
            
            <!-- Tab Switcher (Start / Finish) -->
            <div class="flex bg-slate-900 p-1 rounded-xl mb-6 border border-slate-700">
                <button id="tabStart" onclick="switchTab('start')" class="flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all bg-emerald-500 text-slate-900 shadow">🚀 Mulai (Start)</button>
                <button id="tabFinish" onclick="switchTab('finish')" class="flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white">🏁 Selesai (Finish)</button>
            </div>

            <!-- Form Utama -->
            <form id="evForm" onsubmit="handleSubmit(event)" class="space-y-4">
                
                <!-- ID Unit / Token -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">ID Unit / Token Akses</label>
                    <input type="text" id="token" required placeholder="Contoh: EV-PLUIT-01" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>

                <!-- Angka kWh Meter -->
                <div>
                    <label id="labelAngka" class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Angka kWh Meter Awal</label>
                    <input type="number" step="0.1" id="angka" required placeholder="Contoh: 1542.5" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>

                <!-- Upload Foto kWh Meter -->
                <div>
                    <label id="labelFoto" class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Foto Bukti kWh Awal</label>
                    <div class="relative border-2 border-dashed border-slate-700 hover:border-emerald-500 rounded-xl p-4 text-center cursor-pointer transition-colors bg-slate-900">
                        <input type="file" id="foto" accept="image/*" required onchange="previewFileName(this)" class="absolute inset-0 opacity-0 cursor-pointer">
                        <div id="fileLabel" class="text-xs text-slate-400">
                            📸 <span class="text-emerald-400 font-medium">Klik untuk upload foto</span> atau tarik file kesini
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btnSubmit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all transform active:scale-95 text-sm mt-2">
                    Proses Sesi Mulai
                </button>
            </form>

            <!-- Status Alert Box -->
            <div id="alertBox" class="hidden mt-4 p-3 rounded-xl text-xs font-medium text-center"></div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500">
        &copy; 2026 Apartemen Muara Indah Riverside &bull; Tenant Relations
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let currentMode = 'start'; // 'start' atau 'finish'

        function switchTab(mode) {
            currentMode = mode;
            const btnStart = document.getElementById('tabStart');
            const btnFinish = document.getElementById('tabFinish');
            const labelAngka = document.getElementById('labelAngka');
            const labelFoto = document.getElementById('labelFoto');
            const btnSubmit = document.getElementById('btnSubmit');

            if (mode === 'start') {
                btnStart.className = "flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all bg-emerald-500 text-slate-900 shadow";
                btnFinish.className = "flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
                labelAngka.innerText = "Angka kWh Meter Awal";
                labelFoto.innerText = "Foto Bukti kWh Awal";
                btnSubmit.innerText = "Proses Sesi Mulai";
                btnSubmit.className = "w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all text-sm mt-2";
            } else {
                btnFinish.className = "flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all bg-amber-500 text-slate-900 shadow";
                btnStart.className = "flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
                labelAngka.innerText = "Angka kWh Meter Akhir";
                labelFoto.innerText = "Foto Bukti kWh Akhir";
                btnSubmit.innerText = "Simpan & Lapor Selesai";
                btnSubmit.className = "w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all text-sm mt-2";
            }
        }

        function previewFileName(input) {
            const fileLabel = document.getElementById('fileLabel');
            if (input.files && input.files[0]) {
                fileLabel.innerHTML = `✅ File dipilih: <span class="text-emerald-400 font-semibold">${input.files[0].name}</span>`;
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            
            const token = document.getElementById('token').value;
            const angka = document.getElementById('angka').value;
            const fotoInput = document.getElementById('foto');
            const btnSubmit = document.getElementById('btnSubmit');
            const alertBox = document.getElementById('alertBox');

            if (fotoInput.files.length === 0) {
                showAlert("Wajib upload foto bukti kWh meter!", "error");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Sedang Mengirim Data...";

            // Konversi file foto ke Base64 agar gampang dikirim via GAS
            const file = fotoInput.files[0];
            const reader = new FileReader();

            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1];
                
                const payload = {
                    action: currentMode, // 'start' atau 'finish'
                    token: token,
                    angka: angka,
                    fotoName: file.name,
                    fotoMime: file.type,
                    fotoBase64: base64Data
                };

                try {
                    // --- GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT LU ---
                    const SCRIPT_URL = "URL_WEB_APP_GAS_LU_DISINI"; 

                    const response = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    
                    if (result.status === "SUCCESS") {
                        showAlert(result.message, "success");
                        document.getElementById('evForm').reset();
                        document.getElementById('fileLabel').innerHTML = `📸 <span class="text-emerald-400 font-medium">Klik untuk upload foto</span> atau tarik file kesini`;
                    } else {
                        showAlert("Gagal: " + result.message, "error");
                    }
                } catch (error) {
                    showAlert("Terjadi kesalahan koneksi ke server. Coba lagi.", "error");
                    console.error(error);
                } finally {
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = currentMode === 'start' ? "Proses Sesi Mulai" : "Simpan & Lapor Selesai";
                }
            };

            reader.readAsDataURL(file);
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-300', 'border', 'border-emerald-500/30', 'bg-rose-500/20', 'text-rose-300', 'border-rose-500/30');
            
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border', 'border-emerald-500/30');
            } else {
                alertBox.classList.add('bg-rose-500/20', 'text-rose-300', 'border', 'border-rose-500/30');
            }
            alertBox.innerText = message;
        }
    </script>
</body>
</html>
